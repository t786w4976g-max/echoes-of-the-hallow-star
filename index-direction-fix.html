<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Echoes of the Hollow Star</title>
  <link rel="stylesheet" href="style.css?v=12">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="title-screen">
    <div class="eyebrow">Kingdom of Zandria</div>
    <h1>Echoes of the<br>Hollow Star</h1>
    <p>Kota's first guild assignment begins in Ashbrook, a frontier village where an ancient light has awakened.</p>
    <button id="begin">Begin</button>
  </div>

  <div id="hud">
    <div class="top-row">
      <div class="vitals">
        <div class="label">Vigor</div>
        <div class="bar"><div id="hp"></div></div>
      </div>
      <div class="quest">
        <div class="label gold">Guild Assignment</div>
        <div id="quest-text">Find Guild Master Rowan</div>
      </div>
    </div>

    <div id="objective-marker">
      <div class="arrow">▲</div>
      <div id="objective-distance">0 m</div>
    </div>

    <div id="interaction-prompt">Talk</div>
    <div id="controller-status">Controller connected</div>

    <div id="stick"><div id="knob"></div></div>
    <button id="roll" class="round-button">Roll</button>
    <button id="attack" class="round-button">Punch</button>

    <div id="toast"></div>

    <div id="dialogue">
      <div id="speaker"></div>
      <div id="line"></div>
      <div class="continue">Tap to continue</div>
    </div>
  </div>

  <div id="build-status">REAL KOTA BUILD</div>
  <div id="model-status">Loading Kota…</div>
  <script src="game.js?v=15"></script>
</body>
</html>
