<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Echoes of the Hollow Star</title><script src="https://cdn.babylonjs.com/babylon.js"></script><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070c;color:#f2ead7;font-family:Georgia,serif;touch-action:none;user-select:none}#game{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;justify-content:space-between;text-shadow:0 2px 8px #000}.label{font:10px Arial;letter-spacing:.22em;text-transform:uppercase;color:#c6cbd7;margin-bottom:5px}#hpbox{width:min(42vw,190px);height:10px;border:1px solid #ffffff55;background:#0009}#hp{height:100%;background:linear-gradient(90deg,#8a2727,#dc6258)}#quest{text-align:right;max-width:55vw}#quest b{display:block;color:#e3b866;font:10px Arial;letter-spacing:.2em;text-transform:uppercase}#quest span{font-size:17px}#stick{position:absolute;width:128px;height:128px;left:22px;bottom:calc(env(safe-area-inset-bottom) + 24px);border:1px solid #ffffff30;border-radius:50%;background:#0a102040;pointer-events:auto}#knob{position:absolute;width:54px;height:54px;left:37px;top:37px;border-radius:50%;background:#e9e2d899;box-shadow:0 0 22px #e3b86666}.btn{position:absolute;border-radius:50%;display:grid;place-items:center;pointer-events:auto;border:1px solid #ffffff66;background:#11192dcc;color:#fff;text-transform:uppercase;font:600 13px Arial;letter-spacing:.08em}#attack{right:22px;bottom:calc(env(safe-area-inset-bottom) + 27px);width:92px;height:92px}#roll{right:118px;bottom:calc(env(safe-area-inset-bottom) + 93px);width:70px;height:70px}#title{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(circle at 50% 15%,#263457 0,#101624 48%,#05070c 100%)}#title small{font:11px Arial;letter-spacing:.34em;text-transform:uppercase;color:#e3b866}#title h1{text-align:center;font-size:clamp(38px,10vw,70px);line-height:.92;margin:18px 0 15px;text-shadow:0 0 28px #e3b86644}#title p{max-width:540px;text-align:center;line-height:1.55;color:#cbc6bb}#begin{pointer-events:auto;padding:14px 34px;border:1px solid #e3b866;background:#e3b86614;color:white;font:18px Georgia;letter-spacing:.14em;text-transform:uppercase}#toast{position:absolute;top:32%;left:15px;right:15px;text-align:center;font-size:27px;text-shadow:0 3px 16px #000;opacity:0;transition:.35s}#toast.show{opacity:1}#dialogue{position:absolute;left:0;right:0;bottom:0;padding:24px 22px calc(env(safe-area-inset-bottom) + 26px);background:linear-gradient(transparent,#05070df5 25%);display:none;pointer-events:auto}#dialogue.show{display:block}#speaker{color:#e3b866;font:12px Arial;letter-spacing:.22em;text-transform:uppercase;margin-bottom:8px}#line{font-size:18px;line-height:1.55}#hint{font:10px Arial;letter-spacing:.18em;text-transform:uppercase;color:#8d96aa;margin-top:10px}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="top"><div><div class="label">Vigor</div><div id="hpbox"><div id="hp"></div></div></div><div id="quest"><b>Guild Assignment</b><span id="questText">Reach the ancient beacon</span></div></div><div id="stick"><div id="knob"></div></div><div class="btn" id="roll">Roll</div><div class="btn" id="attack">Strike</div><div id="toast"></div><div id="dialogue"><div id="speaker"></div><div id="line"></div><div id="hint">Tap to continue</div></div></div><div id="title"><small>Kingdom of Zandria</small><h1>Echoes of the<br>Hollow Star</h1><p>Kota's first guild assignment leads beyond Ashbrook, where a forgotten beacon has begun to shine beneath a broken sky.</p><button id="begin">Enter Zandria</button></div><script>
const C=document.getElementById('game'),E=new BABYLON.Engine(C,true),S=new BABYLON.Scene(E);S.clearColor=new BABYLON.Color4(.025,.035,.065,1);S.fogMode=BABYLON.Scene.FOGMODE_EXP2;S.fogDensity=.012;S.fogColor=new BABYLON.Color3(.08,.11,.18);const cam=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,1.1,9,new BABYLON.Vector3(0,1.4,0),S);cam.lowerRadiusLimit=6;cam.upperRadiusLimit=11;cam.attachControl(C,true);const h=new BABYLON.HemisphericLight('h',new BABYLON.Vector3(-.3,1,.2),S);h.intensity=.7;const moon=new BABYLON.DirectionalLight('m',new BABYLON.Vector3(-.4,-1,.25),S);moon.position=new BABYLON.Vector3(15,28,-15);moon.intensity=1.2;const sh=new BABYLON.ShadowGenerator(1024,moon);sh.useBlurExponentialShadowMap=true;function mat(n,c,e){let m=new BABYLON.PBRMaterial(n,S);m.albedoColor=BABYLON.Color3.FromHexString(c);m.roughness=.85;if(e)m.emissiveColor=BABYLON.Color3.FromHexString(e);return m}const grass=mat('g','#23372e'),stone=mat('s','#525764'),wood=mat('w','#4b3024'),tunic=mat('t','#315b3c'),skin=mat('sk','#bf8b6f'),dark=mat('d','#131824'),gold=mat('go','#9d7437'),glow=mat('gl','#4a89b8','#277bc8'),enemyMat=mat('em','#39243f','#4b173e');const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:90,height:90},S);ground.material=grass;ground.receiveShadows=true;for(let i=0;i<50;i++){let x=(Math.random()-.5)*80,z=(Math.random()-.5)*80;if(Math.hypot(x,z)<8)continue;let t=BABYLON.MeshBuilder.CreateCylinder('trunk',{height:2.2,diameter:.45,tessellation:7},S);t.position.set(x,1.1,z);t.material=wood;let c=BABYLON.MeshBuilder.CreateCylinder('crown',{height:3.6,diameterTop:0,diameterBottom:2.8,tessellation:8},S);c.position.set(x,3.3,z);c.material=grass;sh.addShadowCaster(t);sh.addShadowCaster(c)}for(let i=0;i<16;i++){let r=BABYLON.MeshBuilder.CreatePolyhedron('rock',{type:1,size:.7+Math.random()*1.3},S);r.scaling.y=.55;r.position.set((Math.random()-.5)*55,.35,(Math.random()-.5)*55);r.material=stone;sh.addShadowCaster(r)}function kota(){let root=new BABYLON.TransformNode('Kota',S),b=BABYLON.MeshBuilder.CreateCapsule('body',{height:2.05,radius:.43},S),head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:.72,segments:12},S),cloak=BABYLON.MeshBuilder.CreateCylinder('cloak',{height:1.55,diameterTop:.65,diameterBottom:1.05,tessellation:10,arc:.62},S),pend=BABYLON.MeshBuilder.CreateSphere('pend',{diameter:.18},S),sw=BABYLON.MeshBuilder.CreateBox('sword',{width:.09,height:1.35,depth:.04},S);b.parent=head.parent=cloak.parent=pend.parent=sw.parent=root;b.position.y=1.15;b.material=tunic;head.position.y=2.35;head.material=skin;cloak.position.set(0,1.35,.25);cloak.rotation.y=Math.PI/2;cloak.material=dark;pend.position.set(0,1.85,-.43);pend.material=glow;sw.position.set(.58,1.3,.1);sw.rotation.z=-.18;sw.material=gold;root.position.set(0,0,8);[b,head,cloak,pend,sw].forEach(x=>sh.addShadowCaster(x));return{root,sw}}const P=kota(),BR=new BABYLON.TransformNode('Beacon',S);BR.position.set(0,0,-18);for(let i=0;i<6;i++){let p=BABYLON.MeshBuilder.CreateBox('ruin',{width:1.2,height:3+Math.random()*3,depth:1.2},S),a=i*Math.PI/3;p.position.set(Math.cos(a)*4,2,Math.sin(a)*4);p.parent=BR;p.material=stone;sh.addShadowCaster(p)}const beacon=BABYLON.MeshBuilder.CreatePolyhedron('beacon',{type:2,size:1.15},S);beacon.parent=BR;beacon.position.y=3.1;beacon.material=glow;const bl=new BABYLON.PointLight('bl',new BABYLON.Vector3(0,3.1,0),S);bl.parent=BR;bl.diffuse=new BABYLON.Color3(.25,.65,1);bl.intensity=18;bl.range=18;const ps=new BABYLON.ParticleSystem('dust',300,S);ps.particleTexture=new BABYLON.Texture('https://assets.babylonjs.com/textures/flare.png',S);ps.emitter=beacon;ps.color1=new BABYLON.Color4(.2,.65,1,1);ps.color2=new BABYLON.Color4(.8,.9,1,.7);ps.minSize=.05;ps.maxSize=.18;ps.emitRate=80;ps.direction1=new BABYLON.Vector3(-.5,.6,-.5);ps.direction2=new BABYLON.Vector3(.5,1.6,.5);ps.start();let enemies=[];function spawn(x,z){let root=new BABYLON.TransformNode('enemy',S),b=BABYLON.MeshBuilder.CreateSphere('eb',{diameter:1.15},S),eye=BABYLON.MeshBuilder.CreateSphere('eye',{diameter:.18},S);b.parent=eye.parent=root;b.position.y=.72;b.scaling.z=1.3;b.material=enemyMat;eye.position.set(0,.85,-.58);eye.material=glow;root.position.set(x,0,z);root.metadata={hp:3,cool:0};sh.addShadowCaster(b);enemies.push(root)}spawn(-6,-7);spawn(7,-10);spawn(3,-23);let mx=0,my=0,hp=100,attack=false,roll=false,started=false,dialog=false;const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null,ctr={};function sm(e){let t=[...e.changedTouches].find(q=>q.identifier===sid);if(!t)return;let dx=t.clientX-ctr.x,dy=t.clientY-ctr.y,l=Math.hypot(dx,dy),m=39,s=Math.min(1,m/(l||1)),x=dx*s,y=dy*s;knob.style.transform=`translate(${x}px,${y}px)`;mx=x/m;my=y/m}stick.ontouchstart=e=>{let r=stick.getBoundingClientRect();ctr={x:r.left+r.width/2,y:r.top+r.height/2};sid=e.changedTouches[0].identifier;sm(e)};stick.ontouchmove=e=>{e.preventDefault();sm(e)};stick.ontouchend=()=>{sid=null;mx=my=0;knob.style.transform=''};function toast(t){let q=document.getElementById('toast');q.textContent=t;q.classList.add('show');setTimeout(()=>q.classList.remove('show'),1200)}function strike(){if(attack||dialog)return;attack=true;let st=performance.now(),iv=setInterval(()=>{let p=(performance.now()-st)/260;P.sw.rotation.z=-.18+Math.sin(Math.min(1,p)*Math.PI)*2.2;if(p>=1){clearInterval(iv);P.sw.rotation.z=-.18;attack=false}},16);enemies.forEach(e=>{if(!e.isDisposed()&&BABYLON.Vector3.Distance(e.position,P.root.position)<2.4){if(--e.metadata.hp<=0){e.dispose();toast('Corruption dispersed')}}})}document.getElementById('attack').onpointerdown=strike;document.getElementById('roll').onpointerdown=()=>{if(!roll&&!dialog){roll=true;setTimeout(()=>roll=false,430)}};const lines=[['Astraea','At last, the lost child reaches a place erased from mortal memory.'],['Kota','Who are you?'],['Astraea','I am Astraea, keeper of the hour between moments. Vaelgor is devouring Zandria’s history.'],['Astraea','Take the first Star. Let what has been broken remember what it was.'],['System','STAR OF ECHOES AWAKENED — The path to Bramble Cave is now revealed.']];let li=0;function show(){document.getElementById('speaker').textContent=lines[li][0];document.getElementById('line').textContent=lines[li][1]}function talk(){dialog=true;li=0;document.getElementById('dialogue').classList.add('show');show()}document.getElementById('dialogue').onpointerdown=()=>{if(++li>=lines.length){dialog=false;document.getElementById('dialogue').classList.remove('show');document.getElementById('questText').textContent='Return to Ashbrook with the Star';toast('Star System Unlocked')}else show()};S.onBeforeRenderObservable.add(()=>{if(!started||dialog)return;let dt=Math.min(.033,E.getDeltaTime()/1000),x=mx,y=my,l=Math.hypot(x,y);if(l>.08){let f=cam.getForwardRay().direction;f.y=0;f.normalize();let r=BABYLON.Vector3.Cross(BABYLON.Axis.Y,f).normalize(),d=r.scale(x).add(f.scale(-y)).normalize();P.root.position.addInPlace(d.scale((roll?10.5:4.8)*dt));P.root.rotation.y=Math.atan2(d.x,d.z)}cam.target=BABYLON.Vector3.Lerp(cam.target,P.root.position.add(new BABYLON.Vector3(0,1.45,0)),.1);enemies.forEach(e=>{if(e.isDisposed())return;e.metadata.cool=Math.max(0,e.metadata.cool-dt);let dist=BABYLON.Vector3.Distance(e.position,P.root.position);if(dist<10){let d=P.root.position.subtract(e.position);d.y=0;d.normalize();e.position.addInPlace(d.scale(dt*(dist<2?.5:1.4)));e.rotation.y=Math.atan2(d.x,d.z)}if(dist<1.25&&e.metadata.cool<=0&&!roll){hp=Math.max(0,hp-12);e.metadata.cool=1.1;document.getElementById('hp').style.width=hp+'%';if(hp<=0){hp=100;P.root.position.set(0,0,8);document.getElementById('hp').style.width='100%';toast('The stars return you to the path')}}});beacon.rotation.y+=dt*.65;if(BABYLON.Vector3.Distance(P.root.position,BR.position)<3.5&&document.getElementById('questText').textContent.includes('beacon'))talk()});document.getElementById('begin').onclick=()=>{document.getElementById('title').style.display='none';started=true;toast('Follow the blue star')};E.runRenderLoop(()=>S.render());addEventListener('resize',()=>E.resize());
</script></body></html>
